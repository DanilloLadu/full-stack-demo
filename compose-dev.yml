networks:
  spring-network:
    driver: bridge

volumes:
  postgres:
    driver: local
  keycloak:
    driver: local
  solr:
    driver: local
  zoo1data:
    driver: local

services:
  postgres:
    container_name: postgres-dev
    image: postgres:alpine
    user: root
    environment:
      POSTGRES_USER: spring
      POSTGRES_PASSWORD: spring
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: demo
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - spring-network
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev-jwt
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - spring-network

  solr:
    image: solr:9.7.0
    container_name: solr
    ports:
      - "8983:8983"
#    environment:
#      - ZK_HOST=zoo-1:2181
    networks:
      - spring-network
    volumes:
      - solr:/var/solr
    command:
      - solr-precreate
      - spring
#    depends_on:
#      - zoo-1

